name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_TEST_MONGODB_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      AUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      RUN_LOCAL_AZURITE_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked Python dependencies
        working-directory: backend
        run: uv sync --locked --python 3.12 --extra dev
      - name: Lint backend
        working-directory: backend
        run: uv run --no-sync ruff check .
      - name: Start test dependencies
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 120 mongo redis azurite
          timeout 120s docker compose run --rm --no-deps mongo-init
      - name: Run backend tests
        working-directory: backend
        run: uv run --no-sync pytest -q -ra
      - name: Show test dependency logs on failure
        if: failure()
        run: docker compose logs --tail 60 mongo redis azurite
      - name: Remove test containers and volumes
        if: always()
        run: docker compose --env-file .env.example down --volumes

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend types
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
