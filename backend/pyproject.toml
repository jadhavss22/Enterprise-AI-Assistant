[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-assistant-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "motor>=3.7,<4",
  "pymongo>=4.9,<5",
  "redis>=5.2,<6",
  "celery>=5.4,<6",
  "azure-storage-blob[aio]>=12.25,<13",
  "httpx>=0.28,<1",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.32",
  "pymupdf>=2.0",
  "python-docx>=1.2.0",
  "tiktoken>=0.14.0",
  "openai>=3.40.0",
  "pinecone>=10.2.0",
  "sentence-transformers>=5.1,<6",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

